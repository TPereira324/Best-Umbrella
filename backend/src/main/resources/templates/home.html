<!DOCTYPE html>
<html lang="pt" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Best Umbrella • Checkout</title>
  <style>
    :root {
      --bg: #f5f7fa;
      --text: #1f2d3d;
      --muted: #6b7c93;
      --primary: #0070ba;
      --primary-dark: #005ea6;
      --card: #ffffff;
      --border: #e6ecf3;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; background: var(--bg); color: var(--text); }
    .header { display: flex; align-items: center; gap: 12px; padding: 20px 24px; background: #fff; border-bottom: 1px solid var(--border); }
    .pp-logo { height: 28px; }
    .brand { font-weight: 700; color: var(--text); }
    .container { max-width: 920px; margin: 32px auto; padding: 0 16px; }
    .hero { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
    .title { font-size: 24px; font-weight: 800; margin: 0 0 8px 0; }
    .subtitle { color: var(--muted); margin: 0 0 18px 0; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-weight: 600; color: var(--muted); }
    .field input, .field select { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
    .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
    .btn { appearance: none; border: none; border-radius: 8px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-ghost { background: transparent; color: var(--primary); }
    .note { color: var(--muted); font-size: 14px; }
    @media (max-width: 720px) { .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="header">
    <img src="/img/paypal-logo.svg" alt="PayPal" class="pp-logo" />
    <span class="brand">Best Umbrella</span>
  </header>
  <main class="container">
    <section class="hero">
      <h1 class="title">Pagamento</h1>
      <p class="subtitle">Preencha os dados e avance para o checkout.</p>

      <form method="post" action="/pay">
        <div class="grid">
          <div class="field">
            <label for="price">Valor</label>
            <input type="text" id="price" name="price" value="10.00" />
          </div>
          <div class="field">
            <label for="currency">Moeda</label>
            <select id="currency" name="currency">
              <option value="EUR" selected>EUR</option>
              <option value="USD">USD</option>
              <option value="GBP">GBP</option>
            </select>
          </div>
<!-- xml -->
<!-- Adicione estas dependências dentro de `dependencies` em `pom.xml` -->
<dependency>
  <groupId>com.google.zxing</groupId>
  <artifactId>core</artifactId>
  <version>3.5.2</version>
</dependency>
<dependency>
  <groupId>com.google.zxing</groupId>
  <artifactId>javase</artifactId>
  <version>3.5.2</version>
</dependency>          <div class="field">
            <label for="method">Método</label>
            <input type="text" id="method" name="method" value="paypal" />
          </div>
          <div class="field">
            <label for="intent">Intent</label>
            <input type="text" id="intent" name="intent" value="sale" />
          </div>
          <div class="field" style="grid-column: 1 / -1;">
            <label for="description">Descrição</label>
            <input type="text" id="description" name="description" value="Pagamento Best Umbrella" />
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary">Avançar para checkout</button>
          <a href="/paypal.html" class="btn btn-ghost">Testar com PayPal SDK</a>
        </div>
        <p class="note">Nota: pode usar o botão acima para testar a integração via JS SDK (sandbox).</p>
      </form>
    </section>
  </main>
</body>
</html>
