<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pagamento PayPal (Demo)</title>
    <style>
      :root {
        --bg: #f5f7fa;
        --text: #1f2d3d;
        --muted: #6b7c93;
        --primary: #0070ba;
        --primary-dark: #005ea6;
        --card: #ffffff;
        --border: #e6ecf3;
        --success: #2ecc71;
        --danger: #d0021b;
      }
      * { box-sizing: border-box; }
      body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", sans-serif; background: var(--bg); color: var(--text); }
      .header { display: flex; align-items: center; gap: 12px; padding: 20px 24px; background: #fff; border-bottom: 1px solid var(--border); }
      .pp-logo { height: 28px; }
      .container { max-width: 920px; margin: 32px auto; padding: 0 16px; }
      .hero { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 28px; box-shadow: 0 6px 18px rgba(0,0,0,0.06); }
      .title { font-size: 24px; font-weight: 800; margin: 0 0 6px 0; }
      .subtitle { color: var(--muted); margin: 0 0 18px 0; }
      .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 16px; }
      .field { display: flex; flex-direction: column; gap: 6px; }
      .field label { font-weight: 600; color: var(--muted); }
      .field input, .field select { border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; }
      .status { margin: 14px 0; padding: 10px 12px; border-radius: 8px; background: #eef6ff; border: 1px solid #cfe5ff; color: #093b6d; }
      .row { margin: 14px 0; }
      .btn { appearance: none; border: none; border-radius: 8px; padding: 10px 14px; font-weight: 600; cursor: pointer; }
      .btn-primary { background: var(--primary); color: #fff; }
      .btn-primary:hover { background: var(--primary-dark); }
      .btn-ghost { background: transparent; color: var(--primary); }
      .card { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 18px; }
      details { margin-top: 12px; }
      summary { cursor: pointer; color: var(--primary); font-weight: 600; }
      pre { background: #0b1e3b; color: #e6f0ff; border-radius: 8px; padding: 14px; font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace; overflow: auto; max-height: 360px; border: 1px solid #0e2b57; }
      #friendly { font-weight: 600; margin-bottom: 8px; }
    </style>
  </head>
  <body>
    <header class="header">
      <img src="/img/paypal-logo.svg" alt="PayPal" class="pp-logo" />
    </header>
    <main class="container">
      <section class="hero">
        <h1 class="title">Pagamento PayPal (Sandbox)</h1>
        <p class="subtitle">Integração com JS SDK e endpoints do seu backend.</p>

        <div class="grid">
          <div class="field">
            <label for="amount">Valor</label>
            <input id="amount" type="text" value="10.00" />
          </div>
          <div class="field">
            <label for="currency">Moeda</label>
            <select id="currency">
              <option value="EUR" selected>EUR</option>
              <option value="USD">USD</option>
              <option value="GBP">GBP</option>
            </select>
          </div>
        </div>

        <div class="card">
          <div id="paypal-button-container"></div>
          <div id="status" class="status"></div>
        </div>

        <details>
          <summary>Modo sem SDK (fallback)</summary>
          <div class="row" style="margin-top:8px;">
            <button id="btnCreate" class="btn btn-primary">Criar ordem</button>
            <a id="approveLinkAnchor" href="#" target="_blank" class="btn btn-ghost" style="display:none;">Abrir aprovação no PayPal</a>
            <button id="btnCapture" class="btn">Finalizar</button>
          </div>
        </details>

        <h3 style="margin-top:18px;">Resposta</h3>
        <div id="friendly"></div>
        <button id="toggleDetails" class="btn btn-ghost" style="display:none;">Mostrar detalhes</button>
        <pre id="result" style="display:none;">Aguardando ações...</pre>
      </section>
    </main>

    <script>
      async function loadSdkAndRender() {
        // Buscar o clientId do backend (endpoints estão públicos para a beta)
        const cidResp = await fetch('/api/paypal/client-id');
        const { clientId } = await cidResp.json();
        if (!clientId) {
          document.getElementById('status').textContent = 'Falha ao obter clientId do backend';
          return;
        }

        // Injetar o script do PayPal JS SDK dinamicamente
        const sdk = document.createElement('script');
        sdk.src = `https://www.paypal.com/sdk/js?client-id=${encodeURIComponent(clientId)}&currency=EUR`;
        sdk.onload = initButtons;
        sdk.onerror = () => {
          document.getElementById('status').textContent = 'Falha ao carregar o SDK do PayPal — usando modo sem SDK.';
          setupFallback();
        };
        document.head.appendChild(sdk);
      }

      function initButtons() {
        document.getElementById('status').textContent = '';
        paypal.Buttons({
          createOrder: async () => {
            const value = document.getElementById('amount').value || '10.00';
            const currency = document.getElementById('currency').value || 'EUR';
            const resp = await fetch(`/api/paypal/order?value=${encodeURIComponent(value)}&currency=${encodeURIComponent(currency)}`, {
              method: 'POST'
            });
            const data = await resp.json();
            handleResponse(resp, data, 'criar');
            if (!resp.ok) throw new Error('Falha ao criar ordem');
            return data.orderId; // o SDK precisa do orderId
          },
          onApprove: async (data) => {
            // DEMO beta: não capturar automaticamente
            document.getElementById('status').textContent = 'Aprovação concluída. Sem captura automática nesta demonstração.';
            // Redireciona para página de sucesso onde a captura é opcional/manual
            window.location.href = `/success.html?orderId=${encodeURIComponent(data.orderID)}`;
          },
          onError: (err) => {
            document.getElementById('status').textContent = 'Erro nos botões do PayPal';
            setFriendly('Ocorreu um erro no componente do PayPal. Tente novamente.');
            setDetails(String(err));
          }
        }).render('#paypal-button-container');
        // Mesmo com SDK, disponibilizar fallback
        setupFallback();
      }

      function setupFallback() {
        const statusEl = document.getElementById('status');
        const approveA = document.getElementById('approveLinkAnchor');
        let currentOrderId = null;

        document.getElementById('btnCreate').onclick = async () => {
          const value = document.getElementById('amount').value || '10.00';
          const currency = document.getElementById('currency').value || 'EUR';
          statusEl.textContent = 'Criando ordem...';
          const resp = await fetch(`/api/paypal/order?value=${encodeURIComponent(value)}&currency=${encodeURIComponent(currency)}`, { method: 'POST' });
          const data = await resp.json();
          handleResponse(resp, data, 'criar');
          if (resp.ok && data.orderId && data.approveLink) {
            currentOrderId = data.orderId;
            approveA.href = data.approveLink;
            approveA.style.display = 'inline';
            statusEl.textContent = 'Ordem criada. Clique em “Abrir aprovação no PayPal”, aprove e depois clique em “Finalizar”.';
          } else {
            statusEl.textContent = 'Falha ao criar ordem.';
          }
        };

        document.getElementById('btnCapture').onclick = async () => {
          if (!currentOrderId) {
            statusEl.textContent = 'Crie e aprove uma ordem primeiro.';
            return;
          }
          statusEl.textContent = 'A concluir...';
          const resp = await fetch(`/api/paypal/capture/${encodeURIComponent(currentOrderId)}`, { method: 'POST' });
          const data = await resp.json();
          handleResponse(resp, data, 'capturar');
          statusEl.textContent = resp.ok ? 'Pagamento concluído!' : 'Falha na conclusão.';
        };
      }

      // UX helpers
      const friendlyEl = document.getElementById('friendly');
      const resultEl = document.getElementById('result');
      const toggleBtn = document.getElementById('toggleDetails');
      toggleBtn.onclick = () => {
        const showing = resultEl.style.display !== 'none';
        resultEl.style.display = showing ? 'none' : 'block';
        toggleBtn.textContent = showing ? 'Mostrar detalhes' : 'Ocultar detalhes';
      };

      function setFriendly(text) {
        friendlyEl.textContent = text;
      }
      function setDetails(any) {
        resultEl.textContent = typeof any === 'string' ? any : JSON.stringify(any, null, 2);
        toggleBtn.style.display = 'inline-block';
      }

      function handleResponse(resp, data, tipo) {
        // Mensagens amigáveis
        if (resp.ok) {
          if (tipo === 'criar') setFriendly('Ordem criada com sucesso. Prossiga para aprovação.');
          else if (tipo === 'capturar') setFriendly('Pagamento concluído com sucesso.');
        } else {
          const status = resp.status;
          const msg = (data && (data.message || data.error)) || resp.statusText || 'Erro desconhecido';
          let friendly = 'Ocorreu um erro.';
          if (status === 401 || /Unauthorized/i.test(msg)) {
            friendly = 'Credenciais do PayPal inválidas ou modo incorreto (sandbox vs live).';
          } else if (status === 422) {
            friendly = 'A ordem não foi aprovada ou os dados são inválidos.';
          } else if (status === 400) {
            friendly = 'Pedido inválido (verifique valor/moeda).';
          } else if (status >= 500) {
            friendly = 'Falha interna ao comunicar com o PayPal. Tente novamente.';
          }
          setFriendly(friendly);
        }
        // Detalhes técnicos ficam ocultos por padrão
        setDetails(data);
      }

      loadSdkAndRender();
    </script>
  </body>
</html>
